<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | BEETHOVENS German Gurukul</title>
  <link rel="icon" type="image/png" href="images/logo-circle.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // If user accesses /courses instead of /courses.html on GitHub pages, redirect cleanly
    var p = window.location.pathname.replace(/^\/BeethovenGerman\/?/i, '');
    var valid = ['courses', 'about', 'resources', 'contact'];
    if (valid.indexOf(p) !== -1) {
      window.location.replace('/BeethovenGerman/' + p + '.html' + window.location.search + window.location.hash);
    }
  </script>
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-link">
        <img src="images/logo-circle.png" alt="BEETHOVENS Logo" class="brand-logo">
        <div class="brand-text">
          <div class="brand-title">BEETHOVENS</div>
          <div class="brand-tagline">ज्ञानस्य गुरुकुलम्, भाषायाः संगमः</div>
        </div>
      </a>
    </div>
  </header>
  <main style="flex:1; display:flex; align-items:center; justify-content:center; text-align:center; padding: 4rem 1rem;">
    <div class="gold-frame" style="max-width:500px; width:100%;">
      <h1 style="font-family:'Cinzel',serif; font-size:2.5rem; color:var(--maroon);">404</h1>
      <h2 style="font-size:1.3rem; color:var(--forest); margin:0.5rem 0;">Page Not Found</h2>
      <p style="color:var(--muted); font-size:0.95rem;">The page you are looking for does not exist or has moved.</p>
      <a href="index.html" class="btn-gold-cta" style="margin-top:1.5rem;">Return to Homepage</a>
    </div>
  </main>
</body>
</html>
